
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check real-time weather conditions for cities around the world.">
    <title>Advanced Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <section class="weather-card">
            <h1>🌤️ Weather App</h1>
            <p class="subtitle">Check weather conditions around the world</p>

            <form id="weatherForm">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    autocomplete="off"
                    required
                >
                <button type="submit" id="searchButton">Search</button>
            </form>

            <p id="message" class="message" role="status" aria-live="polite"></p>

            <div id="weatherInfo" class="weather-info" hidden>
                <h2 id="cityName"></h2>
                <div id="weatherIcon" class="weather-icon"></div>
                <h3 id="temperature"></h3>
                <p id="description" class="description"></p>

                <div class="details">
                    <div class="detail-box">
                        <span>Humidity</span>
                        <h4 id="humidity"></h4>
                    </div>
                    <div class="detail-box">
                        <span>Wind Speed</span>
                        <h4 id="wind"></h4>
                    </div>
                </div>
                <p id="updatedTime" class="updated-time"></p>
            </div>

            <footer>
                Weather data provided by
                <a href="https://open-meteo.com/" target="_blank" rel="noopener">
                    Open-Meteo
                </a>
            </footer>
        </section>
    </main>

</body>
</html>
